<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Animi characters</title>
<style>
  body { margin: 0; padding: 24px; background: linear-gradient(#f4f1ff, #e9f3ff); font: 600 15px -apple-system, sans-serif; color: #3a3560; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  h2 + .grid { margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 170px); gap: 16px; }
  .card { background: #fff; border-radius: 18px; padding: 10px 0 12px; text-align: center; box-shadow: 0 4px 14px rgba(60, 50, 120, .08); }
  iframe { width: 150px; height: 180px; border: 0; display: block; margin: 0 auto 6px; }
  small { display: block; font-weight: 500; color: #7a74a0; margin-top: 2px; }
</style>
</head>
<body>
<h2>Characters</h2>
<div class="grid">
  <div class="card"><iframe src="animi.html#bot"></iframe>🤖 Bolt</div>
  <div class="card"><iframe src="animi.html#cat"></iframe>🐱 Mochi</div>
  <div class="card"><iframe src="animi.html#ghost"></iframe>👻 Boo</div>
  <div class="card"><iframe src="animi.html#slime"></iframe>💧 Jelly</div>
  <div class="card"><iframe src="animi.html#penguin"></iframe>🐧 Pip</div>
  <div class="card"><iframe src="animi.html#panda"></iframe>🐼 Bao</div>
</div>
<h2>Heroes <small>shown doing their signature move</small></h2>
<div class="grid">
  <div class="card"><iframe src="animi.html#tether:move"></iframe>🪝 Tether</div>
  <div class="card"><iframe src="animi.html#cirrus:move"></iframe>☁️ Cirrus</div>
  <div class="card"><iframe src="animi.html#volta:move"></iframe>⚡ Volta</div>
  <div class="card"><iframe src="animi.html#gust:move"></iframe>💨 Gust</div>
  <div class="card"><iframe src="animi.html#rumble:move"></iframe>⛰️ Rumble</div>
  <div class="card"><iframe src="animi.html#aegis:move"></iframe>🛡️ Aegis</div>
</div>
</body>
</html>
