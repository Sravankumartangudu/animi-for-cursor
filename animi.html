<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; }
  svg { width: 100%; height: 100%; display: block; }
  .zz { font: 700 13px -apple-system, "SF Pro Rounded", sans-serif; fill: #8b7bd8; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
// ---------------------------------------------------------------------------
// Characters. Every character uses the same element ids so the shared engine
// can drive it: root, head, face, eyesOpen/eyeL/eyeR (data-x/data-y = centre),
// eyesHappy, eyesSleep, eyesWow, m_smile, m_grin, m_o, blushL, blushR.
// `update` animates anything character-specific (tails, flames, ears...).
// ---------------------------------------------------------------------------
const CHARS = {};

// ---------- Bolt: hovering robot ----------
CHARS.bot = {
  face: { x: 100, y: 93 }, faceShift: [12, 8], turn: 5, pivot: [100, 140],
  motion: 'fly', tiltPivot: 120, base: 200, zAt: [150, 50], heartY: 60, shadow: 'glow',
  defs: `
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#e3e9f4"/><stop offset="1" stop-color="#b8c3d9"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b4ca"/><stop offset="1" stop-color="#76829c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2a4d"/><stop offset="1" stop-color="#0a0f22"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fdff"/><stop offset=".35" stop-color="#5ef2ff"/><stop offset="1" stop-color="#4a7dff" stop-opacity="0"/></linearGradient>
    <clipPath id="screenClip"><rect x="52" y="58" width="96" height="70" rx="24"/></clipPath>`,
  body: `
    <g id="flameG"><path d="M90,204 Q100,236 110,204 Z" fill="url(#flame)" filter="url(#glow)"/></g>
    <rect x="87" y="196" width="26" height="9" rx="4.5" fill="url(#metal)"/>
    <g id="handL"><circle cx="52" cy="172" r="10" fill="url(#shell)" stroke="#aab5cb"/></g>
    <g id="handR"><circle cx="148" cy="172" r="10" fill="url(#shell)" stroke="#aab5cb"/></g>
    <rect x="66" y="146" width="68" height="54" rx="25" fill="url(#shell)" stroke="#aab5cb"/>
    <path d="M76,156 Q86,150 98,150" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="174" r="10" fill="url(#screen)"/>
    <path id="core" d="M100,179 C93,174 95,167 100,170.5 C105,167 107,174 100,179 Z" fill="#ff6b8b" filter="url(#glow)"/>
    <g id="head">
      <rect x="90" y="136" width="20" height="12" rx="4" fill="url(#metal)"/>
      <g id="antenna">
        <path d="M100,40 L100,18" stroke="#8f9ab2" stroke-width="3.5" stroke-linecap="round"/>
        <circle id="bulb" cx="100" cy="14" r="6.5" fill="#ff6b8b" filter="url(#glow)"/>
        <circle cx="98" cy="12" r="2" fill="#fff" opacity=".8"/>
      </g>
      <rect x="28" y="70" width="18" height="44" rx="9" fill="url(#metal)"/>
      <rect x="154" y="70" width="18" height="44" rx="9" fill="url(#metal)"/>
      <circle cx="37" cy="92" r="4" fill="#5ef2ff" filter="url(#glow)"/>
      <circle cx="163" cy="92" r="4" fill="#5ef2ff" filter="url(#glow)"/>
      <rect x="40" y="38" width="120" height="104" rx="38" fill="url(#shell)" stroke="#aab5cb"/>
      <path d="M58,52 Q72,43 92,43" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <g id="screenG">
        <rect x="52" y="58" width="96" height="70" rx="24" fill="url(#screen)"/>
        <g clip-path="url(#screenClip)">
          <g id="face">
            <ellipse id="blushL" cx="68" cy="108" rx="7" ry="3.5" fill="#ff6b8b"/>
            <ellipse id="blushR" cx="132" cy="108" rx="7" ry="3.5" fill="#ff6b8b"/>
            <g fill="#5ef2ff" stroke="#5ef2ff" filter="url(#glow)">
              <g id="eyesOpen">
                <g id="eyeL" data-x="80" data-y="90"><rect x="-8" y="-11" width="16" height="22" rx="8" stroke="none"/><circle cx="-3" cy="-5" r="2.2" fill="#fff" stroke="none"/></g>
                <g id="eyeR" data-x="120" data-y="90"><rect x="-8" y="-11" width="16" height="22" rx="8" stroke="none"/><circle cx="-3" cy="-5" r="2.2" fill="#fff" stroke="none"/></g>
              </g>
              <g id="eyesHappy" fill="none" stroke-width="3.5" stroke-linecap="round"><path d="M71,93 Q80,81 89,93"/><path d="M111,93 Q120,81 129,93"/></g>
              <g id="eyesSleep" fill="none" stroke-width="3" stroke-linecap="round"><path d="M72,91 Q80,96 88,91"/><path d="M112,91 Q120,96 128,91"/></g>
              <g id="eyesWow" fill="none" stroke-width="3"><circle cx="80" cy="90" r="8"/><circle cx="120" cy="90" r="8"/></g>
              <g id="m_smile" fill="none" stroke-width="3" stroke-linecap="round"><path d="M92,108 Q100,114 108,108"/></g>
              <g id="m_grin" stroke="none"><path d="M90,106 H110 Q108,117 100,117 Q92,117 90,106 Z"/></g>
              <g id="m_o" fill="none" stroke-width="2.5"><circle cx="100" cy="111" r="4"/></g>
            </g>
          </g>
          <path d="M60,128 L96,58 H118 L82,128 Z" fill="#fff" opacity=".05"/>
        </g>
      </g>
    </g>`,
  update(t, S) {
    attr('screenG', 'transform', `translate(${S.cx * 2.5},${S.cy * 2})`);
    attr('antenna', 'transform', `rotate(${Math.sin(t / 520) * 4 - S.svx * 2.2 - S.cx * 6},100,40)`);
    attr('bulb', 'opacity', S.sleeping ? .3 : .7 + .3 * Math.sin(t / 380));
    attr('core', 'transform', `translate(100,174) scale(${.9 + .12 * Math.sin(t / 300)}) translate(-100,-174)`);
    const w = Math.abs(S.wave);
    attr('handL', 'transform', `translate(${-S.svx * .6},${Math.sin(t / 600) * 2.5 + S.svy * .5 - w})`);
    attr('handR', 'transform', `translate(${-S.svx * .6},${Math.sin(t / 600 + 1.6) * 2.5 + S.svy * .5 - w})`);
    const len = (S.sleeping ? .45 : .7) + Math.min(S.speed / 10, 1) * .8 + Math.random() * .12;
    attr('flameG', 'transform', `translate(100,204) scale(${.85 + Math.random() * .1},${len}) translate(-100,-204)`);
  }
};

// ---------- Mochi: ginger cat ----------
CHARS.cat = {
  face: { x: 100, y: 122 }, faceShift: [8, 5], turn: 6, pivot: [100, 170],
  motion: 'hop', tiltPivot: 200, base: 228, zAt: [150, 62], heartY: 60, shadow: 'dark',
  defs: `
    <radialGradient id="fur" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#ffe3c8"/></radialGradient>
    <linearGradient id="ginger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb46b"/><stop offset="1" stop-color="#ef8636"/></linearGradient>`,
  body: `
    <g id="tail"><path d="M136,206 C172,206 182,168 168,146 C162,136 150,142 156,153 C166,170 160,190 134,192 Z" fill="url(#ginger)"/></g>
    <ellipse cx="100" cy="194" rx="44" ry="33" fill="url(#fur)"/>
    <ellipse cx="100" cy="200" rx="25" ry="19" fill="#fffdf9"/>
    <ellipse cx="80" cy="222" rx="13" ry="8" fill="#fff6ec"/><ellipse cx="120" cy="222" rx="13" ry="8" fill="#fff6ec"/>
    <path d="M76,224 v-4 M80,225 v-4 M84,224 v-4 M116,224 v-4 M120,225 v-4 M124,224 v-4" stroke="#e8c9a8" stroke-width="1.3" stroke-linecap="round"/>
    <g id="head">
      <g id="earL"><path d="M44,106 Q38,56 56,42 Q66,38 94,70 Z" fill="url(#ginger)"/><path d="M53,94 Q50,64 58,56 Q64,54 80,72 Z" fill="#ffb3c1"/></g>
      <g id="earR"><path d="M156,106 Q162,56 144,42 Q134,38 106,70 Z" fill="url(#ginger)"/><path d="M147,94 Q150,64 142,56 Q136,54 120,72 Z" fill="#ffb3c1"/></g>
      <ellipse cx="100" cy="122" rx="64" ry="52" fill="url(#fur)"/>
      <path d="M90,73 L93,86 M100,71 V87 M110,73 L107,86" stroke="#ef8636" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M38,118 l10,2 M37,126 l10,0" stroke="#ef8636" stroke-width="3" stroke-linecap="round"/>
      <path d="M162,118 l-10,2 M163,126 l-10,0" stroke="#ef8636" stroke-width="3" stroke-linecap="round"/>
      <g id="face">
        <ellipse id="blushL" cx="68" cy="140" rx="11" ry="5.5" fill="#ff8fa6"/>
        <ellipse id="blushR" cx="132" cy="140" rx="11" ry="5.5" fill="#ff8fa6"/>
        <g id="eyesOpen">
          <g id="eyeL" data-x="77" data-y="122"><ellipse rx="9" ry="11" fill="#2a1d1a"/><circle cx="-3" cy="-4" r="3.6" fill="#fff"/><circle cx="3.2" cy="4" r="1.6" fill="#fff"/></g>
          <g id="eyeR" data-x="123" data-y="122"><ellipse rx="9" ry="11" fill="#2a1d1a"/><circle cx="-3" cy="-4" r="3.6" fill="#fff"/><circle cx="3.2" cy="4" r="1.6" fill="#fff"/></g>
        </g>
        <g id="eyesHappy" fill="none" stroke="#2a1d1a" stroke-width="3.5" stroke-linecap="round"><path d="M68,125 Q77,113 86,125"/><path d="M114,125 Q123,113 132,125"/></g>
        <g id="eyesSleep" fill="none" stroke="#2a1d1a" stroke-width="3" stroke-linecap="round"><path d="M69,122 Q77,128 85,122"/><path d="M115,122 Q123,128 131,122"/></g>
        <g id="eyesWow"><circle cx="77" cy="122" r="11" fill="#2a1d1a"/><circle cx="123" cy="122" r="11" fill="#2a1d1a"/><circle cx="74" cy="118" r="4.5" fill="#fff"/><circle cx="120" cy="118" r="4.5" fill="#fff"/></g>
        <path d="M95.5,133 H104.5 Q104,136 100,139 Q96,136 95.5,133 Z" fill="#ff8fa3"/>
        <g id="m_smile"><path d="M90,141 Q95,146 100,140 Q105,146 110,141" fill="none" stroke="#6b3b2e" stroke-width="1.8" stroke-linecap="round"/></g>
        <g id="m_grin"><path d="M91,141 Q100,141 109,141 Q107,152 100,152 Q93,152 91,141 Z" fill="#c2405a"/><path d="M95,148 Q100,145 105,148 Q100,152 95,148 Z" fill="#ff9fb2"/></g>
        <g id="m_o"><ellipse cx="100" cy="145" rx="3.5" ry="4.5" fill="#c2405a"/></g>
        <path d="M52,134 L30,130 M52,140 L30,143 M148,134 L170,130 M148,140 L170,143" stroke="#d9b796" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <path d="M70,168 Q100,184 130,168" fill="none" stroke="#ff5c7a" stroke-width="5" stroke-linecap="round"/>
    <g id="bell"><circle cx="100" cy="180" r="6" fill="#ffd34d" stroke="#e0a91f"/><path d="M96,181 H104" stroke="#a87b10" stroke-width="1.3"/></g>`,
  update(t, S) {
    const k = S.cheering ? 3 : S.speed > .5 ? 2 : 1;
    attr('tail', 'transform', `rotate(${Math.sin(t / (650 / k)) * 9 + S.svx * 1.5},138,200)`);
    const twitch = (t % 4200) < 180 ? Math.sin((t % 4200) / 180 * Math.PI) * 12 : 0;
    attr('earL', 'transform', `rotate(${-twitch - Math.abs(S.wave) * .4},60,100)`);
    attr('earR', 'transform', `rotate(${Math.abs(S.wave) * .4},140,100)`);
    attr('bell', 'transform', `rotate(${Math.sin(t / 300) * 6 - S.svx * 3},100,172)`);
  }
};

// ---------- Boo: friendly ghost ----------
CHARS.ghost = {
  face: { x: 100, y: 108 }, faceShift: [10, 6], turn: 4, pivot: [100, 200],
  motion: 'fly', tiltK: .7, tiltPivot: 110, base: 200, zAt: [150, 50], heartY: 50, shadow: 'dark',
  defs: `
    <radialGradient id="ghostG" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f1edff"/><stop offset="1" stop-color="#d9d0ff"/></radialGradient>`,
  body: `
    <g id="head">
      <g id="armL"><ellipse cx="38" cy="142" rx="12" ry="7" fill="url(#ghostG)" transform="rotate(-30,38,142)"/></g>
      <g id="armR"><ellipse cx="162" cy="142" rx="12" ry="7" fill="url(#ghostG)" transform="rotate(30,162,142)"/></g>
      <path id="ghostBody" fill="url(#ghostG)" filter="url(#softGlow)"/>
      <ellipse cx="72" cy="66" rx="14" ry="7" fill="#fff" transform="rotate(-30,72,66)"/>
      <g id="face">
        <ellipse id="blushL" cx="66" cy="126" rx="11" ry="5.5" fill="#ff9ec0"/>
        <ellipse id="blushR" cx="134" cy="126" rx="11" ry="5.5" fill="#ff9ec0"/>
        <g id="eyesOpen">
          <g id="eyeL" data-x="80" data-y="106"><ellipse rx="8" ry="12" fill="#2a2350"/><circle cx="-2.5" cy="-5" r="3.2" fill="#fff"/></g>
          <g id="eyeR" data-x="120" data-y="106"><ellipse rx="8" ry="12" fill="#2a2350"/><circle cx="-2.5" cy="-5" r="3.2" fill="#fff"/></g>
        </g>
        <g id="eyesHappy" fill="none" stroke="#2a2350" stroke-width="3.5" stroke-linecap="round"><path d="M71,109 Q80,97 89,109"/><path d="M111,109 Q120,97 129,109"/></g>
        <g id="eyesSleep" fill="none" stroke="#2a2350" stroke-width="3" stroke-linecap="round"><path d="M72,106 Q80,112 88,106"/><path d="M112,106 Q120,112 128,106"/></g>
        <g id="eyesWow"><circle cx="80" cy="106" r="10" fill="#2a2350"/><circle cx="120" cy="106" r="10" fill="#2a2350"/><circle cx="77" cy="102" r="4" fill="#fff"/><circle cx="117" cy="102" r="4" fill="#fff"/></g>
        <g id="m_smile"><path d="M93,124 Q100,130 107,124" fill="none" stroke="#2a2350" stroke-width="2" stroke-linecap="round"/></g>
        <g id="m_grin"><path d="M91,122 Q100,123 109,122 Q107,135 100,135 Q93,135 91,122 Z" fill="#5a3a7a"/><path d="M95,131 Q100,127 105,131 Q100,135 95,131 Z" fill="#ff9ec0"/></g>
        <g id="m_o"><ellipse cx="100" cy="128" rx="5.5" ry="7.5" fill="#2a2350"/></g>
      </g>
    </g>`,
  update(t, S) {
    // Wavy hem that ripples faster while flying.
    const ph = t / (S.speed > .5 ? 140 : 260);
    let d = 'M40,118 C40,60 68,32 100,32 C132,32 160,60 160,118 L160,192';
    for (let i = 0; i < 6; i++) {
      const x0 = 160 - i * 20, cy = 196 + (i % 2 ? -1 : 1) * (8 + Math.sin(ph + i) * 4), ey = 194 + Math.sin(ph + i * 1.3) * 3;
      d += ` Q${x0 - 10},${cy + 6} ${x0 - 20},${ey}`;
    }
    attr('ghostBody', 'd', d + ' Z');
    attr('head', 'opacity', S.sleeping ? .7 : .97);
    const w = S.wave;
    attr('armL', 'transform', `rotate(${Math.sin(t / 500) * 8 + w * 2},48,142)`);
    attr('armR', 'transform', `rotate(${-Math.sin(t / 500) * 8 - w * 2},152,142)`);
  }
};

  body: `
    <g id="head">
      <path d="M100,62 Q108,82 130,98 C158,118 172,150 170,182 C168,212 136,224 100,224 C64,224 32,212 30,182 C28,150 42,118 70,98 Q92,82 100,62 Z" fill="url(#slimeG)" opacity=".96"/>
      <g id="bubbles" fill="#fff" opacity=".35"><circle id="b1" r="4"/><circle id="b2" r="2.6"/><circle id="b3" r="3.2"/></g>
      <ellipse cx="68" cy="128" rx="15" ry="9" fill="#fff" opacity=".75" transform="rotate(-38,68,128)"/>
      <circle cx="86" cy="108" r="4" fill="#fff" opacity=".7"/>
      <g id="sprout"><path d="M100,64 Q95,48 82,46 Q88,60 100,64 Z" fill="#4caf50"/><path d="M100,64 Q106,46 120,45 Q112,60 100,64 Z" fill="#66c26a"/></g>
      <g id="face">
        <ellipse id="blushL" cx="64" cy="180" rx="11" ry="5.5" fill="#ff8fa6"/>
        <ellipse id="blushR" cx="136" cy="180" rx="11" ry="5.5" fill="#ff8fa6"/>
        <g id="eyesOpen">
          <g id="eyeL" data-x="80" data-y="164"><ellipse rx="7.5" ry="10.5" fill="#173a2c"/><circle cx="-2.5" cy="-4" r="3" fill="#fff"/><circle cx="2.5" cy="4" r="1.3" fill="#fff"/></g>
          <g id="eyeR" data-x="120" data-y="164"><ellipse rx="7.5" ry="10.5" fill="#173a2c"/><circle cx="-2.5" cy="-4" r="3" fill="#fff"/><circle cx="2.5" cy="4" r="1.3" fill="#fff"/></g>
        </g>
        <g id="eyesHappy" fill="none" stroke="#173a2c" stroke-width="3.5" stroke-linecap="round"><path d="M72,167 Q80,156 88,167"/><path d="M112,167 Q120,156 128,167"/></g>
        <g id="eyesSleep" fill="none" stroke="#173a2c" stroke-width="3" stroke-linecap="round"><path d="M72,164 Q80,170 88,164"/><path d="M112,164 Q120,170 128,164"/></g>
        <g id="eyesWow"><circle cx="80" cy="164" r="10" fill="#173a2c"/><circle cx="120" cy="164" r="10" fill="#173a2c"/><circle cx="77" cy="160" r="4" fill="#fff"/><circle cx="117" cy="160" r="4" fill="#fff"/></g>
        <g id="m_smile"><path d="M93,182 Q100,188 107,182" fill="none" stroke="#173a2c" stroke-width="2" stroke-linecap="round"/></g>
        <g id="m_grin"><path d="M91,180 Q100,181 109,180 Q107,192 100,192 Q93,192 91,180 Z" fill="#1d5a40"/><path d="M95,188 Q100,185 105,188 Q100,192 95,188 Z" fill="#ff8fa6"/></g>
        <g id="m_o"><ellipse cx="100" cy="185" rx="4" ry="5" fill="#173a2c"/></g>
      </g>
    </g>`,
  update(t, S) {
    attr('sprout', 'transform', `rotate(${Math.sin(t / 450) * 8 - S.svx * 2},100,64)`);
    [[0, 130, 4600], [1, 75, 3700], [2, 112, 5200]].forEach(([i, x, p]) => {
      const a = ((t + i * 1700) % p) / p;
      attr('b' + (i + 1), 'transform', `translate(${x + Math.sin(a * 8) * 4},${212 - a * 90})`);
      attr('b' + (i + 1), 'opacity', Math.sin(a * Math.PI));
    });
  }
};

// ---------------------------------------------------------------------------
// Heroes. Original designs (not based on any existing comic character). Each
// one performs its signature move while it travels after the cursor.
// They share one chibi layout: head centred at (100,102), eyes at y=108.

const skin = (a, b) => `<radialGradient id="skin" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
const grad = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const DOMINO = 'M56,100 Q78,86 100,96 Q122,86 144,100 Q150,116 136,124 Q116,128 100,118 Q84,128 64,124 Q50,116 56,100 Z';
const HEAD = '<ellipse cx="100" cy="102" rx="46" ry="44" fill="url(#skin)"/>';
const HERO = { face: { x: 100, y: 108 }, faceShift: [7, 4], turn: 4, pivot: [100, 150], eyeMove: [3, 3.2],
               base: 224, zAt: [150, 50], heartY: 50, shadow: 'dark' };
const legs = (suit, boot) => `
    <g id="legL"><rect x="84" y="190" width="14" height="28" rx="7" fill="${suit}"/><ellipse cx="90" cy="221" rx="9.5" ry="5" fill="${boot}"/></g>

  ? `<g id="${id}"><path d="M78,156 Q64,170 66,186" fill="none" stroke="${sleeve}" stroke-width="12" stroke-linecap="round"/><circle cx="66" cy="189" r="6.5" fill="${glove}"/></g>`
  : `<g id="${id}"><path d="M122,156 Q136,170 134,186" fill="none" stroke="${sleeve}" stroke-width="12" stroke-linecap="round"/><circle cx="134" cy="189" r="6.5" fill="${glove}"/></g>`;

// Eyes have a white lens and a pupil (pupilL/pupilR) that the engine moves inside it.
// `lid` colours the closed/happy eye lines: white over a mask, dark over skin.
function heroFace(mask = '', lid = '#fff', iris = '#1d2340') {

  </g>`;
}

    const sx = 140 - 40 * m, sy = 182 - 146 * m, k = 1 - .38 * m;
    attr('staff', 'transform', `translate(${sx},${sy}) rotate(${this.ang}) scale(${k})`);

    attr('armL', 'transform', `rotate(${Math.abs(S.wave) * 2 + Math.sin(t / 500) * 3},78,156)`);
    const bolt = (x1, y1, x2, y2) => {
      let d = `M${x1},${y1}`;
      for (let i = 1; i < 6; i++) d += ` L${x1 + (x2 - x1) * i / 6 + (Math.random() - .5) * 10},${y1 + (y2 - y1) * i / 6 + (Math.random() - .5) * 10}`;

};

    <g id="armR"><path d="M134,164 Q144,176 146,186" fill="none" stroke="#4d5c80" stroke-width="14" stroke-linecap="round"/><circle cx="134" cy="158" r="13" fill="url(#suitG)"/>
      <circle cx="148" cy="192" r="13" fill="url(#steel)"/><path d="M142,186 h14 M141,192 h16" stroke="#8a95ab" stroke-width="1.5" stroke-linecap="round"/></g>`,
  update(t, S) {
    // Fists go up while airborne and come down with the landing.
    const a = S.air, w = Math.abs(S.wave) * 2;
    attr('armL', 'transform', `rotate(${a * 140 + w},66,158)`);
    attr('armR', 'transform', `rotate(${-a * 140 - w},134,158)`);
    attr('legL', 'transform', `translate(0,${-a * 6})`);
    attr('legR', 'transform', `translate(0,${-a * 6})`);
  }
};

// ---------- Aegis: hurls a round shield that boomerangs back ----------
CHARS.aegis = { ...HERO,
  motion: 'hop', tiltPivot: 200,
  defs: skin('#f0c8a0', '#d39f74') + grad('suitG', '#3ab47e', '#1f7a52') + grad('bronze', '#ffd08a', '#c27a2c'),
  body: `
    ${legs('url(#suitG)', '#c27a2c')}${torso('url(#suitG)', '#c27a2c')}
    <circle cx="100" cy="168" r="5.5" fill="#ffd08a"/>
    <path d="M100,157 V160 M100,176 V179 M89,168 H92 M108,168 H111 M92,160 L94,162 M108,176 L106,174 M92,176 L94,174 M108,160 L106,162" stroke="#ffd08a" stroke-width="2.2" stroke-linecap="round"/>
    ${arm('armR', 1, '#2a9466', '#c27a2c')}
    <g id="head">
      <path d="M64,72 Q70,26 100,24 Q130,26 136,72 Q100,52 64,72 Z" fill="#ffcf5a"/>
      <path d="M80,40 L84,60 M100,30 V56 M120,40 L116,60" stroke="#e8a92a" stroke-width="2.5" stroke-linecap="round"/>
      ${HEAD}
      <path d="M52,112 Q48,56 100,54 Q152,56 148,112 L138,114 Q140,86 122,80 Q100,76 78,80 Q60,86 62,114 Z" fill="url(#bronze)"/>
      <path d="M62,74 Q100,56 138,74" fill="none" stroke="#fff3d6" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      ${heroFace('', '#4a2a34')}
    </g>
    ${arm('armL', -1, '#2a9466', '#c27a2c')}
    <g id="shield"><circle r="23" fill="url(#bronze)" stroke="#9a5a1c" stroke-width="2.5"/><circle r="16" fill="none" stroke="#fff3d6" stroke-width="2" opacity=".7"/>
      <circle r="5.5" fill="#fff3d6"/><path d="M0,-13 V-9 M0,13 V9 M-13,0 H-9 M13,0 H9 M-9,-9 L-6.5,-6.5 M9,9 L6.5,6.5 M-9,9 L-6.5,6.5 M9,-9 L6.5,-6.5" stroke="#fff3d6" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M-17,-11 A20,20 0 0 1 -5,-19.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/></g>`,
  update(t, S) {
    // While travelling, throw the shield ahead on a loop and catch it again.
    if (S.speed > .8 && t - (this.ts ?? -1e9) > 1300) { this.ts = t; this.dir = S.svx < 0 ? -1 : 1; }
    const p = (t - (this.ts ?? -1e9)) / 950;
    let x = 64, y = 184, r = 0, k = 1;
    if (p < 1) {
      const s = Math.sin(Math.PI * p);
      x = 64 + (100 + this.dir * 78 - 64) * s;
      y = 184 - 60 * s - 22 * Math.sin(2 * Math.PI * p);
      r = p * 1080 * this.dir;
      k = 1 - .25 * s;
    }
    attr('shield', 'transform', `translate(${x},${y}) rotate(${r}) scale(${k})`);
    attr('armL', 'transform', `rotate(${p < 1 ? -70 * Math.sin(Math.PI * Math.min(1, p * 2.5)) : 0},78,156)`);
    attr('armR', 'transform', `rotate(${-Math.abs(S.wave) * 2},122,156)`);
  }
};

// ---------------------------------------------------------------------------
// Engine
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function attr(id, k, v) { const e = $(id); if (e) e.setAttribute(k, v); }
function show(id, on) { const e = $(id); if (e) e.style.display = on ? '' : 'none'; }

const COMMON_DEFS = `
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feColorMatrix in="b" values="0 0 0 0 .75  0 0 0 0 .7  0 0 0 0 1  0 0 0 .5 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="shadowGlow"><stop offset="0" stop-color="#5ef2ff" stop-opacity=".45"/><stop offset="1" stop-color="#5ef2ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="shadowDark"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`;

const S = {
  mx: 100, my: -400, s: 1, vx: 0, vy: 0,      // raw input from native side
  cx: 0, cy: 0, svx: 0, svy: 0, speed: 0,     // smoothed gaze / velocity
  hop: 0, ry: 0, wave: 0, sleeping: false, cheering: false,
  m: 0, air: 0, leapP: 0,                     // smoothed "travelling" 0..1, leap airtime, leap phase
};
let ch, eyeBase = {}, eyeGaze = {}, glance = [0, 0], nextGlance = 0;
let lastMove = performance.now(), lastT = 0, lastKey = '';
let dragging = false, dragStart = 0, cheerStart = -1e9, boopStart = -1e9;
let blinkStart = -1e9, nextBlink = performance.now() + 1500, lastZ = 0, blush = .5;
const particles = [];

window.setCharacter = key => {
  ch = CHARS[key] || CHARS.bot;
  particles.length = 0;
  $('stage').innerHTML = `<defs>${COMMON_DEFS}${ch.defs}</defs>
    <ellipse id="shadow" cx="100" cy="232" rx="38" ry="6" fill="url(#${ch.shadow === 'glow' ? 'shadowGlow' : 'shadowDark'})"/>
    <g id="fxGround"></g>
    <g id="root">${ch.body}<g id="fx"></g></g>`;
  eyeBase = {};
  for (const id of ['eyeL', 'eyeR']) eyeBase[id] = [+$(id).dataset.x, +$(id).dataset.y];
  eyeGaze = { L: [0, 0], R: [0, 0] };
};

// Native side sends: cursor in viewBox units, flight velocity (points/frame, y down), points per unit.
window.look = (mx, my, vx = 0, vy = 0, s = 1) => {
  const key = mx + ',' + my;
  if (key !== lastKey) { lastMove = performance.now(); lastKey = key; }
  Object.assign(S, { mx, my, vx, vy, s });
};
window.setDrag = on => { dragging = on; dragStart = performance.now(); lastMove = dragStart; };
window.cheer = () => {
  cheerStart = performance.now(); lastMove = cheerStart;
  for (let i = 0; i < 6; i++) spawnHeart(i * 110);
};
window.boop = () => { boopStart = performance.now(); lastMove = boopStart; blinkStart = boopStart; };

const SVGNS = 'http://www.w3.org/2000/svg';
function spawnHeart(delay) {
  const el = document.createElementNS(SVGNS, 'path');
  el.setAttribute('d', 'M0,3 C-6,-3 -3,-8 0,-4 C3,-8 6,-3 0,3 Z');
  el.setAttribute('fill', ['#ff6b8b', '#ff9ec0', '#b9a4ff', '#5ef2ff'][Math.floor(Math.random() * 4)]);
  el.setAttribute('opacity', 0);
  $('fx').appendChild(el);
  particles.push({ el, x: 100 + (Math.random() - .5) * 110, y: ch.heartY + Math.random() * 20,
                   drift: (Math.random() - .5) * 20, rise: 50 + Math.random() * 15,
                   born: performance.now() + delay, life: 1300, scale: 1.4 + Math.random() * .8 });
}
function spawnZ() {
  const el = document.createElementNS(SVGNS, 'text');
  el.setAttribute('class', 'zz');
  el.textContent = 'z';
  $('fx').appendChild(el);
  particles.push({ el, x: ch.zAt[0], y: ch.zAt[1], drift: 18, rise: 45, born: performance.now(), life: 2600, scale: 1 });
}
// Landing impact: a shockwave ring and flying pebbles on the ground.
function smash() {
  const g = $('fxGround'), now = performance.now();
  const ring = document.createElementNS(SVGNS, 'ellipse');
  for (const [k, v] of [['cx', 100], ['cy', 226], ['fill', 'none'], ['stroke', '#ffb020'], ['stroke-width', 3]]) ring.setAttribute(k, v);
  g.appendChild(ring);
  particles.push({ el: ring, born: now, life: 480, step(a) {
    ring.setAttribute('rx', 24 + a * 70); ring.setAttribute('ry', 4 + a * 9); ring.setAttribute('opacity', 1 - a);
  } });
  for (let i = 0; i < 6; i++) {
    const r = document.createElementNS(SVGNS, 'path');
    r.setAttribute('d', 'M-3,-2 L2,-3 L3,2 L-1,3 Z');
    r.setAttribute('fill', '#9aa3b5');
    g.appendChild(r);
    const vx = (i - 2.5) * 14 + (Math.random() - .5) * 8, vy = 40 + Math.random() * 25;
    particles.push({ el: r, born: now, life: 520, step(a) {
      r.setAttribute('transform', `translate(${100 + vx * a},${224 - vy * a + 70 * a * a}) rotate(${a * 300})`);
      r.setAttribute('opacity', 1 - a * a);
    } });
  }
}

function frame(t) {
  const dt = Math.min(50, t - (lastT || t));
  lastT = t;
  S.sleeping = !dragging && t - lastMove > 30000;
  S.cheering = t - cheerStart < 1300;

  // Gaze: direction to the cursor, saturating with distance. The head follows slowly;
  // the eyes (below) lead with quick, saccade-like moves, the way real eyes do.
  const dx = (S.mx - ch.face.x) * S.s, dy = (S.my - ch.face.y) * S.s;
  const d = Math.hypot(dx, dy) || 1, f = d / (d + 140);
  const near = d / S.s < 80;
  S.cx += ((S.sleeping ? 0 : dx / d * f) - S.cx) * .07;
  S.cy += ((S.sleeping ? .3 : dy / d * f) - S.cy) * .07;
  S.svx += (S.vx - S.svx) * .2;
  S.svy += (S.vy - S.svy) * .2;
  S.speed = Math.hypot(S.svx, S.svy);
  const moving = S.speed > .5;
  if (moving) S.hop += dt * .013 * Math.min(1.5, .6 + S.speed / 12);
  S.m += ((moving ? 1 : 0) - S.m) * .1;

  // While the cursor rests, the eyes glance around a little now and then.
  const resting = t - lastMove > 1200 && !S.sleeping && !dragging;
  if (!resting) glance = [0, 0];
  else if (t > nextGlance) {
    glance = Math.random() < .4 ? [0, 0] : [(Math.random() - .5) * .6, (Math.random() - .5) * .35];
    nextGlance = t + 700 + Math.random() * 1800;
  }

  // Blink, with the occasional double blink.
  if (t > nextBlink) {
    blinkStart = t;
    nextBlink = t + (Math.random() < .2 ? 260 : 2200 + Math.random() * 4000);
  }
  const bt = (t - blinkStart) / 150;
  const open = bt < 1 ? Math.max(.1, Math.abs(Math.cos(bt * Math.PI))) : 1;

  // Expression.
  const eyes = S.cheering ? 'Happy' : dragging ? 'Wow' : S.sleeping ? 'Sleep' : 'Open';
  for (const e of ['Open', 'Happy', 'Sleep', 'Wow']) show('eyes' + e, e === eyes);
  const mouth = S.cheering ? 'grin' : dragging ? 'o' : (near && !S.sleeping) ? 'grin' : 'smile';
  for (const m of ['smile', 'grin', 'o']) show('m_' + m, m === mouth);

  // Each eye aims at the cursor on its own (so they converge when it's close), blinks,
  // and the far-side eye narrows a touch when looking sideways. Characters with
  // pupilL/pupilR move just the pupil inside the eye; the rest move the whole eye.
  const lean = 1 - Math.abs(S.cx) * .12, em = ch.eyeMove || [3.5, 3];
  for (const [s, far] of [['L', S.cx > 0], ['R', S.cx < 0]]) {
    const [bx, by] = eyeBase['eye' + s], g = eyeGaze[s];
    const ex = (S.mx - bx) * S.s, ey = (S.my - by) * S.s, ed = Math.hypot(ex, ey) || 1, ef = ed / (ed + 90);
    g[0] += ((S.sleeping ? 0 : ex / ed * ef + glance[0]) - g[0]) * .35;
    g[1] += ((S.sleeping ? 0 : ey / ed * ef + glance[1]) - g[1]) * .35;
    const ox = clamp(g[0], -1, 1) * em[0], oy = clamp(g[1], -1, 1) * em[1];
    const sc = `scale(${far ? lean : 1},${open})`, pupil = $('pupil' + s);
    if (pupil) {
      attr('eye' + s, 'transform', `translate(${bx},${by}) ${sc}`);
      pupil.setAttribute('transform', `translate(${ox},${oy})`);
    } else {
      attr('eye' + s, 'transform', `translate(${bx + ox},${by + oy}) ${sc}`);
    }
  }

  blush += (((S.cheering || near) ? .85 : .4) - blush) * .08;
  attr('blushL', 'opacity', blush);
  attr('blushR', 'opacity', blush);

  attr('face', 'transform', `translate(${S.cx * ch.faceShift[0]},${S.cy * ch.faceShift[1]})`);
  attr('head', 'transform', `rotate(${S.cx * ch.turn + (S.sleeping ? 4 : 0)},${ch.pivot[0]},${ch.pivot[1]})`);

  // Body motion by style.
  let y = 0, tilt = 0, sx = 1, sy = 1;
  const breathe = Math.sin(t / 650) * .012;
  switch (ch.motion) {
    case 'fly':
      y = Math.sin(t / (S.sleeping ? 1100 : 700)) * 3.5;
      tilt = clamp(S.svx * 1.3, -18, 18) * (ch.tiltK ?? 1);
      break;
    case 'hop': {
      const h = Math.abs(Math.sin(S.hop));
      y = moving ? -h * 12 : 0;
      tilt = clamp(S.svx * .6, -8, 8);
      sy = moving ? (h < .2 ? .94 : 1.02) : 1 + breathe;
      sx = 2 - sy;
      break;
    }
    case 'waddle':
      y = moving ? -Math.abs(Math.sin(S.hop)) * 4 : 0;
      tilt = (moving ? Math.sin(S.hop) * 9 : 0) + clamp(S.svx * .4, -6, 6);
      sy = 1 + breathe;
      break;
    case 'squish': {
      const k = moving ? Math.sin(S.hop * 2) * .09 : Math.sin(t / 420) * .025;
      sx = 1 + k; sy = 1 - k;
      y = moving ? -Math.max(0, Math.sin(S.hop)) * 6 : 0;
      tilt = clamp(S.svx * .5, -6, 6);
      break;
    }
    case 'swing':   // hangs from a line above and swings like a pendulum while travelling
      y = Math.sin(t / 800) * 1.5 * (1 - S.m);
      tilt = S.m * (clamp(S.svx * .9, -8, 8) + Math.sin(S.hop * .55) * 6);
      break;
    case 'soar':    // leans into the direction of travel, up to almost horizontal
      y = Math.sin(t / 700) * 3;
      tilt = clamp(S.svx * 3.6, -50, 50);
      break;
    case 'dash':    // leans forward from the feet with a fast running bounce
      y = moving ? -Math.abs(Math.sin(S.hop * 1.6)) * 3 : 0;
      tilt = clamp(S.svx * 2.2, -20, 20);
      sy = 1 + breathe;
      break;
    case 'leap': {  // crouch, big airborne arc, smash landing
      const p = (S.hop / 11) % 1;
      let air = 0;
      if (moving) {
        if (p < .18) { const c = Math.sin(p / .18 * Math.PI); sy = 1 - c * .12; sx = 1 + c * .08; }
        else if (p < .82) { const q = (p - .18) / .64; y = -46 * 4 * q * (1 - q); air = Math.sin(q * Math.PI); sy = 1.04; sx = .97; }
        else { const c = Math.sin((p - .82) / .18 * Math.PI); sy = 1 - c * .16; sx = 1 + c * .12; }
        if (S.leapP < .82 && p >= .82) smash();
      } else { sy = 1 + breathe; sx = 2 - sy; }
      S.leapP = moving ? p : 0;
      S.air += (air - S.air) * .3;
      tilt = clamp(S.svx * .5, -8, 8);
      break;
    }
  }
  S.ry += (y - S.ry) * (ch.motion === 'leap' ? .6 : .35);

  // Shared reactions: hop + wave on cheer, squish on boop, dangle while dragged.
  const cp = (t - cheerStart) / 1300;
  S.wave = cp < 1 ? Math.sin(cp * Math.PI * 6) * 14 * (1 - cp) : 0;
  const jump = cp < 1 ? -Math.abs(Math.sin(cp * Math.PI * 2)) * 12 * (1 - cp) : 0;
  const bp = (t - boopStart) / 450;
  if (bp < 1) { const k = Math.sin(bp * Math.PI) * (1 - bp); sx *= 1 + k * .07; sy *= 1 - k * .08; }
  if (dragging) tilt += Math.sin((t - dragStart) / 130) * 6;
  attr('root', 'transform',
    `translate(0,${S.ry + jump}) rotate(${tilt},${ch.tiltPivotX ?? 100},${ch.tiltPivot}) translate(100,${ch.base}) scale(${sx},${sy}) translate(-100,-${ch.base})`);
  const lift = S.ry + jump;
  attr('shadow', 'transform', `translate(100,232) scale(${dragging ? .55 : 1 + lift * .015}) translate(-100,-232)`);

  ch.update?.(t, S);

  // Particles.
  if (S.sleeping && t - lastZ > 1400) { lastZ = t; spawnZ(); }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const a = (t - p.born) / p.life;
    if (a < 0) continue;
    if (a >= 1) { p.el.remove(); particles.splice(i, 1); continue; }
    if (p.step) { p.step(a); continue; }
    const x = p.x + p.drift * a + Math.sin(a * 9) * 3, py = p.y - p.rise * a;
    p.el.setAttribute('transform', `translate(${x},${py}) scale(${p.scale * (.6 + a * .6)})`);
    p.el.setAttribute('opacity', a < .15 ? a / .15 : 1 - (a - .15) / .85);
  }

  requestAnimationFrame(frame);
}

// Preview only (gallery.html): "#key:move" shows a character travelling right.
const [hashKey, hashMode] = location.hash.slice(1).split(':');
setCharacter(window.initialChar || hashKey || 'bot');
if (hashMode === 'move') setInterval(() => look(400, 60, 9, -1, 1), 16);
requestAnimationFrame(frame);
</script>
</body>
</html>
